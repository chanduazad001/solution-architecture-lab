site_name: Solution Architecture Lab
site_description: Cloud Architecture, Platform Engineering, DevSecOps and AI
site_author: Chandra Sekhar Merugu
site_url: https://chanduazad001.github.io/solution-architecture-lab/

repo_name: chanduazad001/solution-architecture-lab
repo_url: https://github.com/chanduazad001/solution-architecture-lab
edit_uri: edit/master/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - search.highlight
    - content.code.copy

plugins:
  - search

extra:
  homepage: https://chanduazad001.github.io/

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.tabbed
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md

  - Architecture:
      - Overview: architecture/index.md
      - Three-Tier LAMP:
          - Overview: architecture/three-tier-lamp/index.md
          - Architecture: architecture/three-tier-lamp/architecture.md
          - Data Flow: architecture/three-tier-lamp/data-flow.md
          - Security: architecture/three-tier-lamp/security.md
          - Availability: architecture/three-tier-lamp/availability.md
          - Decisions: architecture/three-tier-lamp/decisions.md
      - Three-Tier LAMP on Kubernetes:
          - Overview: architecture/three-tier-lamp-kubernetes/index.md
          - Architecture: architecture/three-tier-lamp-kubernetes/architecture.md
          - Data Flow: architecture/three-tier-lamp-kubernetes/data-flow.md
          - Security: architecture/three-tier-lamp-kubernetes/security.md
          - Availability: architecture/three-tier-lamp-kubernetes/availability.md
          - Decisions: architecture/three-tier-lamp-kubernetes/decisions.md

  - System Design:
      - Overview: system-design/index.md
      - Fundamentals: system-design/fundamentals/index.md
      - Requirements & Estimation: system-design/requirements-estimation/index.md
      - Core Building Blocks: system-design/building-blocks/index.md
      - Scalability: system-design/scalability/index.md
      - Availability & Reliability: system-design/availability-reliability/index.md
      - Distributed Systems: system-design/distributed-systems/index.md
      - Data & Databases: system-design/data-databases/index.md
      - Caching: system-design/caching/index.md
      - Messaging & Events: system-design/messaging-events/index.md
      - APIs & Communication: system-design/apis-communication/index.md
      - Security: system-design/security/index.md
      - Observability: system-design/observability/index.md
      - Resilience: system-design/resilience/index.md
      - Design Patterns: system-design/design-patterns/index.md
      - Architecture Decision Making: system-design/decision-making/index.md
      - Case Studies:
          - Overview: system-design/case-studies/index.md
          - URL Shortener:
              - Overview: system-design/case-studies/url-shortener/index.md
              - Architecture: system-design/case-studies/url-shortener/architecture.md
              - Data Flow: system-design/case-studies/url-shortener/data-flow.md
              - Security: system-design/case-studies/url-shortener/security.md
              - Availability: system-design/case-studies/url-shortener/availability.md
              - Decisions: system-design/case-studies/url-shortener/decisions.md
      - Interview Preparation: system-design/interview-preparation/index.md